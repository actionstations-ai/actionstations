<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ft-3gfd01 fd-3gfd01" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="ft-3gfd01">Detector scores for authentic and synthetic video</title><desc id="fd-3gfd01">Detector scores for authentic and synthetic video: histogram of detector scores for 400 authentic and 200 synthetic items. The classes overlap. At the threshold: 41 of 400 authentic items flagged (false positives), 32 of 200 synthetic items passed (false negatives). Item under review: score 0.54 plus or minus 0.12, within its uncertainty of the threshold of 0.50; leans synthetic, and a detector can be wrong. Simulated scores for the exercise, not a real detector.</desc><defs><pattern id="plwr23r-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1f5fbf"/></pattern><pattern id="plwr23r-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#b3121b"/><path d="M-1 1L1 -1M0 8L8 0M7 9L9 7" stroke="#ffffff" stroke-width="1.6"/></pattern></defs><rect width="760" height="380" fill="#ffffff"/><text x="58" y="20" font-size="15" font-weight="700" fill="#14100c">Detector scores for authentic and synthetic video</text><rect x="58" y="35" width="26" height="14" fill="url(#plwr23r-0)" stroke="#14100c" stroke-width="0.8"/><text x="90" y="46" font-size="12" fill="#594c3c">Authentic items</text><rect x="206.8" y="35" width="26" height="14" fill="url(#plwr23r-1)" stroke="#14100c" stroke-width="0.8"/><text x="238.8" y="46" font-size="12" fill="#594c3c">Synthetic items</text><line x1="58" x2="740" y1="278" y2="278" stroke="#d8c79e"/><text x="50" y="282" font-size="11" fill="#594c3c" text-anchor="end">0</text><line x1="58" x2="740" y1="236" y2="236" stroke="#d8c79e"/><text x="50" y="240" font-size="11" fill="#594c3c" text-anchor="end">20</text><line x1="58" x2="740" y1="194" y2="194" stroke="#d8c79e"/><text x="50" y="198" font-size=