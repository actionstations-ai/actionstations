<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ft-1k9fw8y fd-1k9fw8y" viewBox="0 0 760 560" width="760" height="560" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="ft-1k9fw8y">Transfers requested on the video call</title><desc id="fd-1k9fw8y">Transfers requested on the video call: timeline with 15 events and 0 spans on 4 lanes (Requests, Approvals, Payments, Response). 1. 0: Requested (Transfer 1 requested, 480,000 USD). 2. 14: Approved (Transfer 1 approved, 480,000 USD). 3. 20: Released (Transfer 1 released, 480,000 USD). 4. 39: Requested (Transfer 2 requested, 480,000 USD). 5. 45: Approved (Transfer 2 approved, 480,000 USD). 6. 59: Released (Transfer 2 released, 480,000 USD). 7. 84: Requested (Transfer 3 requested, 480,000 USD). 8. 90: Approved (Transfer 3 approved, 480,000 USD). 9. 110: Released (Transfer 3 released, 480,000 USD). 10. 140: Settled (Transfer 1 settled at the beneficiary bank, 480,000 USD). 11. 179: Settled (Transfer 2 settled at the beneficiary bank, 480,000 USD). 12. 190: Discovered (The impersonated executive says they never asked). 13. 204: Hold requested (Hold requested at the bank). 14. 216: Recall sent (Recall request sent). 15. 230: Settled (Transfer 3 settled at the beneficiary bank, 480,000 USD). 3 transfers worth 1,440,000 USD were requested. A hold was requested 204 minutes after the first request; 1 transfer worth 480,000 USD had not settled and could still be stopped, and 960,000 USD had settled. Simulated payments for the exercise; every bank and account is fictional.</desc><defs><pattern id="t1oqatoh-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1f5fbf"/></pattern><pattern id="t1oqatoh-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#b3121b"/><path d="M-1 1L1 -1M0 8L8 0M7 9L9 7" stroke="#ffffff" stroke-width="1.6"/></pattern><pattern id="t1oqatoh-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width=