<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ft-1ub0dqb fd-1ub0dqb" viewBox="0 0 760 204" width="760" height="204" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title id="ft-1ub0dqb">Sampling schedule by designation</title><desc id="fd-1ub0dqb">Sampling schedule by designation: table with 4 rows and columns Designation, Sample every (days), Until. Designation Contact premises, Sample every (days) 5, Until 14 days; Designation At-risk premises, Sample every (days) 10, Until until 56 days after the last detected case; Designation Monitored premises, Sample every (days) 10, Until until 56 days after the last detected case; and 1 more rows.</desc><rect width="760" height="204" fill="#ffffff"/><text x="12" y="20" font-size="15" font-weight="700" fill="#14100c">Sampling schedule by designation</text><rect x="12" y="36" width="736" height="28" fill="#14100c"/><text x="20" y="54" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Designation</text><text x="393.65" y="54" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">Sample every (days)</text><text x="409.65" y="54" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Until</text><rect x="12" y="64" width="736" height="28" fill="#f6efdc"/><text x="20" y="82" font-size="13" fill="#14100c" text-anchor="start">Contact premises</text><text x="393.65" y="82" font-size="13" fill="#14100c" text-anchor="end">5</text><text x="409.65" y="82" font-size="13" fill="#14100c" text-anchor="start">14 days</text><rect x="12" y="92" width="736" height="28" fill="#ffffff"/><text x="20" y="110" font-size="13" fill="#14100c" text-anchor="start">At-risk premises</text><text x="393.65" y="110" font-size="13" fill="#14100c" text-anchor="end">10</text><text x="409.65" y="110" font-size="13" fill="#14100c" text-anchor="start">until 56 days after the last detected case</text><rect x="12" y="120" width="736" height="28" fill="#f6efdc"/><text x="20" y="138" font-size="13" fill="#14100c" text-anchor="start">Monitored premises</text><text x="393.65" y="138" font-size="13" fill="#14100c" text-anchor="end">10</text><text x="409.65" y="138" font-size="13" fill="#14100c" text-anchor="start">until 56 days after the last detected case</text><rect x="12" y="148" width="736" height="28" fill="#ffffff"/><text x="20" y="166" font-size="13" fill="#14100c" text-anchor="start">Surveillance zone premises</text><text x="393.65" y="166" font-size="13" fill="#14100c" text-anchor="end">21</text><text x="409.65" y="166" font-size="13" fill="#14100c" text-anchor="start">until 56 days after the last detected case</text><line x1="12" x2="748" y1="176" y2="176" stroke="#14100c" stroke-width="1.5"/><text x="12" y="194" font-size="11" fill="#594c3c">FMD Red Book (October 2020). A guideline; follow the state plan.</text></svg>