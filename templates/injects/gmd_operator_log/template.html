<div class="sw">
  <div class="sw-ex">{{t 'Exercise product'}}</div>
  <header class="sw-head">
    <div class="sw-org">{{fields.entity}}</div>
    <h1>{{t 'Operator log'}}</h1>
    <div class="sw-sub">{{fields.shift}}</div>
  </header>
  <div class="sw-body">
    <table class="sw-table">
      <thead>
        <tr>
          <th scope="col">{{t 'Time (UTC)'}}</th>
          <th scope="col">{{t 'Entry'}}</th>
          <th scope="col">{{t 'By'}}</th>
        </tr>
      </thead>
      <tbody>
        {{#each fields.entries}}
        <tr>
          <th scope="row">{{time}}</th>
          <td>{{entry}}</td>
          <td>{{by}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
  </div>
  <div class="sw-foot">{{default fields.footer "Exercise log. Not a compliance record."}}</div>
</div>
