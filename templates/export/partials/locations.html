{{#each pages}}
<section class="locations" aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{heading}}</h2>
  <div class="locations__map">
    {{#if schematic}}
    <div class="locations__blank" role="img" aria-label="{{alt}}"></div>
    {{else}}
    <img class="locations__base" src="{{src}}" alt="{{alt}}" />
    {{/if}} {{#each markers}}
    <span class="locations__pin loc-{{kind}}" style="left: {{x}}%; top: {{y}}%">{{n}}</span>
    {{/each}}
  </div>
  {{#if schematic}}
  <p class="muted">Positions only. This page has no street map.</p>
  {{/if}}
  <ol class="locations__legend">
    {{#each markers}}
    <li value="{{n}}">
      <b>{{label}}</b> <span class="muted">{{rows}}</span>{{#if coords}}
      <span class="muted">{{coords}}</span>{{/if}}
    </li>
    {{/each}}
  </ol>
</section>
{{/each}}
