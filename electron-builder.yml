# Installer configuration. Release process, signing and cross-platform notes: docs/RELEASING.md.
appId: com.mdcrowley.actionstations
productName: Action Stations
copyright: Copyright © 2026 Matt Crowley
directories:
  output: release/${version}
  buildResources: build
# Installer file names use the machine name (no spaces: release asset names stay intact).
artifactName: actionstations-${version}-${os}-${arch}.${ext}
# Double-clicking a project folder opens it in the app (#277). macOS treats these folders as
# document packages (Finder: Show Package Contents). .ttxproj is the pre-rename extension.
fileAssociations:
  - ext: asproj
    name: Action Stations Project
    description: Action Stations project
    role: Editor
    isPackage: true
  - ext: ttxproj
    name: Action Stations Project (older)
    description: Action Stations project (older format name)
    role: Editor
    isPackage: true
  # Content packs (#268). Opening one shows its review on the Packs screen; it never installs.
  - ext: aspack
    name: Action Stations Pack
    description: Action Stations content pack
    role: Viewer
    mimeType: application/vnd.actionstations.pack+zip
files:
  - out/**/*
  # The bundled packs ship as extraResources (app-resources/packs), not inside app.asar.
  - '!out/bundled-packs/**'
  - package.json
  - '!**/*.{map,ts,tsx,mts,cts}'
  - '!**/*.d.{ts,mts,cts}'
  # Test goldens, fixtures and package-internal test suites never ship.
  - '!**/__golden__/**'
  - '!**/node_modules/**/{test,tests,__tests__,__mocks__,spec,fixtures}/**'
  - '!**/node_modules/**/*.{md,markdown}'
  # better-sqlite3 ships Node-API prebuilds for every platform; its C sources are build-only.
  - '!**/node_modules/better-sqlite3/{deps,src}/**'
  # transformers.js's Node build bundles what it needs from onnxruntime-web and runs on
  # onnxruntime-node, so the 135 MB web package (mostly WASM) is never loaded (#382).
  - '!**/node_modules/onnxruntime-web/**'
extraResources:
  # Built-in content ships as bundled packs (ADR-0020): templates, prompts, ComfyUI workflows,
  # domain profiles, examples and documents, assembled and validated by
  # scripts/build-bundled-packs.mjs into out/bundled-packs/ (run by `pnpm build`).
  - from: out/bundled-packs
    to: app-resources/packs
  # Not pack items: the fonts and CSS every inject template shares, and the export page templates.
  - from: templates/_shared
    to: app-resources/templates/_shared
  - from: templates/export
    to: app-resources/templates/export
# Native code and data files read with real fs paths must live outside app.asar.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec*/**
  - node_modules/onnxruntime-node/**
  # sharp's libvips ships in its own package with no .node file, so smart-unpack misses the
  # versioned .so on Linux and the local embedder cannot load it (#372).
  - node_modules/@img/**
  - node_modules/@tesseract.js-data/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/pdfjs-dist/standard_fonts/**
  - node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs
npmRebuild: false
# Hardening (#55). Flipped on the packaged Electron binary after packing.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Off since the renderer is served from app://bundle/ (#117, ADR-0013); file:// pages get
  # only what a browser gives them. Render/print windows still load file:// temp documents.
  grantFileProtocolExtraPrivileges: false
  # Unsigned builds: flipping fuses breaks Electron's ad-hoc signature, which Apple silicon
  # refuses to run. Re-sign ad hoc (a real Developer ID replaces this; see docs/RELEASING.md).
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.education
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # No Developer ID certificate yet. docs/RELEASING.md describes signing + notarization.
  identity: null
  # A platform files list that holds only exclusions makes electron-builder copy the whole
  # project into app.asar, so each one restates the positive pattern.
  files:
    - out/**/*
    - '!out/bundled-packs/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-*/{linux,win32}/**'
    # Only this target's native packages (#382): a cross-build installs every platform's.
    - '!**/node_modules/@napi-rs/canvas-{darwin-x64,linux-*,win32-*,android-*,freebsd-*}/**'
    - '!**/node_modules/@img/sharp-{darwin-x64,linux-*,linuxmusl-*,win32-*,wasm32,webcontainers-*}/**'
    - '!**/node_modules/@img/sharp-libvips-{darwin-x64,linux-*,linuxmusl-*}/**'
    - '!**/node_modules/sqlite-vec-{darwin-x64,linux-*,windows-*}/**'
    - '!**/node_modules/better-sqlite3/prebuilds/{darwin-x64,linux-*,linuxmusl-*,win32-*}.node'
dmg:
  title: ${productName} ${version}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # A platform files list that holds only exclusions makes electron-builder copy the whole
  # project into app.asar, so each one restates the positive pattern.
  files:
    - out/**/*
    - '!out/bundled-packs/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-*/{linux,darwin}/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-*/win32/arm64/**'
    - '!**/node_modules/@napi-rs/canvas-{darwin-*,linux-*,win32-arm64-*,win32-ia32-*,android-*,freebsd-*}/**'
    - '!**/node_modules/@img/sharp-{darwin-*,linux-*,linuxmusl-*,win32-arm64,win32-ia32,wasm32,webcontainers-*}/**'
    - '!**/node_modules/@img/sharp-libvips-*/**'
    - '!**/node_modules/sqlite-vec-{darwin-*,linux-*}/**'
    - '!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linux-*,linuxmusl-*,win32-arm64}.node'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: actionstations-${version}-win-${arch}-setup.${ext}
linux:
  executableName: actionstations
  category: Education
  icon: build/icons
  synopsis: Generate complete, editable tabletop exercises from your own plans.
  target:
    - target: AppImage
      arch: [x64]
  # A platform files list that holds only exclusions makes electron-builder copy the whole
  # project into app.asar, so each one restates the positive pattern.
  files:
    - out/**/*
    - '!out/bundled-packs/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-*/{darwin,win32}/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-*/linux/arm64/**'
    - '!**/node_modules/@napi-rs/canvas-{darwin-*,win32-*,linux-arm64-*,linux-arm-*,linux-riscv64-*,linux-x64-musl,android-*,freebsd-*}/**'
    - '!**/node_modules/@img/sharp-{darwin-*,win32-*,linux-arm,linux-arm64,linux-ppc64,linux-riscv64,linux-s390x,linuxmusl-*,wasm32,webcontainers-*}/**'
    - '!**/node_modules/@img/sharp-libvips-{darwin-*,linux-arm,linux-arm64,linux-ppc64,linux-riscv64,linux-s390x,linuxmusl-*}/**'
    - '!**/node_modules/sqlite-vec-{darwin-*,windows-*,linux-arm64}/**'
    - '!**/node_modules/better-sqlite3/prebuilds/{darwin-*,win32-*,linux-arm64,linuxmusl-*}.node'
