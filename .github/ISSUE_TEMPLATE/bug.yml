name: Bug
description: Something is broken
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, app version/commit, providers in use (LM Studio model, ComfyUI version, etc.)
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
